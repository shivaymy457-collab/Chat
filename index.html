<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#075e54">
<title>Chat App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #e5ddd5; height: 100dvh; display: flex; flex-direction: column; }
  header { background: #075e54; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; }
  #onlineCount { font-size: 13px; opacity: .85; }
  #users { background: #fff; display: flex; gap: 14px; overflow-x: auto; padding: 10px 12px; border-bottom: 1px solid #ddd; }
  .user { display: flex; flex-direction: column; align-items: center; min-width: 58px; font-size: 12px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: #128c7e; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; position: relative; }
  .dot { position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; background: #aaa; }
  .dot.on { background: #25d366; }
  .user small { color: #888; font-size: 10px; }
  #msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .m { max-width: 78%; padding: 7px 10px; border-radius: 8px; background: #fff; align-self: flex-start; word-wrap: break-word; }
  .m.me { background: #dcf8c6; align-self: flex-end; }
  .m b { display: block; font-size: 11px; color: #128c7e; margin-bottom: 2px; }
  .m time { display: block; font-size: 10px; color: #999; text-align: right; margin-top: 2px; }
  form { display: flex; gap: 8px; padding: 8px; background: #f0f0f0; }
  input { flex: 1; padding: 11px 14px; border: none; border-radius: 22px; font-size: 16px; outline: none; }
  button { background: #128c7e; color: #fff; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 18px; }
  #err { background: #ffd2d2; color: #900; padding: 10px; font-size: 13px; display: none; }
</style>
</head>
<body>
<header><h1>💬 Chat</h1><span id="onlineCount">connecting…</span></header>
<div id="err"></div>
<div id="users"></div>
<div id="msgs"></div>
<form id="f"><input id="t" placeholder="Message type pannunga" autocomplete="off"><button>➤</button></form>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, set, push, onValue, onDisconnect, serverTimestamp, query, limitToLast }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ====== INGA UNGA FIREBASE CONFIG PASTE PANNUNGA ====== */
const firebaseConfig = {
  apiKey: "AIzaSyBj-m04kgoGkSwW1nHUGrBFB34p1Bj3fAk",
  authDomain: "muchet-8a93c.firebaseapp.com",
  databaseURL: "https://muchet-8a93c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "muchet-8a93c",
  appId: "1:962515643704:web:4772fc5f31bc3f7524a5cd"
};
/* ====================================================== */

const $ = id => document.getElementById(id);
const showErr = m => { $("err").style.display = "block"; $("err").textContent = m; };

let name = localStorage.getItem("chat_name");
while (!name || !name.trim()) name = prompt("Unga peru enna?") || "";
name = name.trim().slice(0, 20);
localStorage.setItem("chat_name", name);

try {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const { user } = await signInAnonymously(auth);
  const uid = user.uid;

  // ---------- Presence (online/offline) ----------
  const myStatus = ref(db, "status/" + uid);
  onValue(ref(db, ".info/connected"), snap => {
    if (!snap.val()) return;
    onDisconnect(myStatus)
      .set({ name, state: "offline", last_changed: serverTimestamp() })
      .then(() => set(myStatus, { name, state: "online", last_changed: serverTimestamp() }));
  });

  // ---------- Users list ----------
  const ago = ts => {
    if (!ts) return "";
    const m = Math.floor((Date.now() - ts) / 60000);
    if (m < 1) return "just now";
    if (m < 60) return m + "m ago";
    const h = Math.floor(m / 60);
    return h < 24 ? h + "h ago" : Math.floor(h / 24) + "d ago";
  };
  onValue(ref(db, "status"), snap => {
    const list = [];
    snap.forEach(c => list.push({ id: c.key, ...c.val() }));
    list.sort((a, b) => (b.state === "online") - (a.state === "online") || (b.last_changed || 0) - (a.last_changed || 0));
    const box = $("users");
    box.innerHTML = "";
    let online = 0;
    list.forEach(u => {
      const on = u.state === "online";
      if (on) online++;
      const d = document.createElement("div");
      d.className = "user";
      const av = document.createElement("div");
      av.className = "avatar";
      av.textContent = (u.name || "?")[0].toUpperCase();
      const dot = document.createElement("span");
      dot.className = "dot" + (on ? " on" : "");
      av.appendChild(dot);
      const nm = document.createElement("span");
      nm.textContent = u.id === uid ? "You" : u.name;
      const sm = document.createElement("small");
      sm.textContent = on ? "online" : ago(u.last_changed);
      d.append(av, nm, sm);
      box.appendChild(d);
    });
    $("onlineCount").textContent = online + " online";
  });

  // ---------- Messages ----------
  onValue(query(ref(db, "messages"), limitToLast(100)), snap => {
    const box = $("msgs");
    box.innerHTML = "";
    snap.forEach(c => {
      const v = c.val();
      const d = document.createElement("div");
      d.className = "m" + (v.uid === uid ? " me" : "");
      const b = document.createElement("b");
      b.textContent = v.uid === uid ? "You" : v.name;
      const p = document.createElement("span");
      p.textContent = v.text;
      const t = document.createElement("time");
      t.textContent = new Date(v.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      d.append(b, p, t);
      box.appendChild(d);
    });
    box.scrollTop = box.scrollHeight;
  });

  $("f").addEventListener("submit", e => {
    e.preventDefault();
    const text = $("t").value.trim();
    if (!text) return;
    push(ref(db, "messages"), { uid, name, text, ts: Date.now() });
    $("t").value = "";
  });
} catch (e) {
  showErr("Error: " + e.message + " — Firebase config / Anonymous login enable pannirukeengala nu check pannunga.");
}
</script>
</body>
</html>
